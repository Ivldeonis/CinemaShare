name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore app/cinemashare.keystore \
          -alias cinemashare \
          -keyalg RSA \
          -keysize 2048 \
          -validity 36500 \
          -storepass cinema123 \
          -keypass cinema123 \
          -dname "CN=CinemaShare, OU=Mobile, O=CinemaShare, L=UA, ST=Ukraine, C=UA"

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=app/cinemashare.keystore \
          -Pandroid.injected.signing.store.password=cinema123 \
          -Pandroid.injected.signing.key.alias=cinemashare \
          -Pandroid.injected.signing.key.password=cinema123

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: CinemaShare-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CinemaShare-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload Keystore
        uses: actions/upload-artifact@v4
        with:
          name: cinemashare-keystore
          path: app/cinemashare.keystore
          if-no-files-found: warn
